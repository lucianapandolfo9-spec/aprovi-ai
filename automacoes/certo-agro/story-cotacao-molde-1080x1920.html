  MOLDE: Story 9:16 da cotação diária da @ (Certo Agro). 1080x1920.
  Uso no n8n: trocar o texto literal dos 5 campos e renderizar o HTML em PNG 1080x1920
  (Chrome headless / Puppeteer / serviço HTML->imagem). Nada mais muda no arquivo.

  CAMPOS: 5 tokens literais entre colchetes (sigla da UF entre colchetes e a palavra data entre
  colchetes). Cada token aparece UMA única vez no arquivo, dentro de <span data-campo="...">,
  e este comentário NÃO contém os tokens (replace simples é seguro):
    data-campo MG, GO, MS, SP -> cotacao_arroba.valor_rs da praça, fonte Scot, formato brasileiro
                                 com 2 casas e vírgula, sem "R$" (o "R$" e o "/@" já estão no molde). Ex.: 349,50
    data-campo data           -> cotacao_arroba.data (a data da COTAÇÃO, não a do render), dd/mm/aaaa

  RODAPÉ FIXO (decisão da Luciana, 06/10/2026): botão "Chame no WhatsApp" todo dia. Story publicado
  pela API não aceita figurinha de link, então o botão é só visual; o número do chip comercial
  (81) 99192-3030 vai escrito embaixo dele. Se o chip mudar, trocar aqui.

  TRAVAS (mesmas do molde O2, roteiro "Orgânico — A Arroba da Semana — Molde"):
    1. As 4 praças com cotação da MESMA data. Se não, não renderiza.
    2. Cotação mais recente com mais de 3 dias úteis: não renderiza, avisa a Luciana.
    3. Ordem fixa MG, GO, MS, SP. Nunca praça que o sistema não cobre.
    4. Nenhum preço escrito à mão: sempre da tabela no dia do render.
